<div class="row">
    <div class="col-md-12">
        <h2 id="jhi-notification-heading" jhiTranslate="ebokApp.notification.detail.title">Notification</h2>
        <div class="row">
            <div class="col-md-8">
                <p-card>
                    <p-fieldset legend="{{'ebokApp.notification.subject' | translate}}">
                        {{notification?.subject}}
                    </p-fieldset>

                    <p-fieldset legend="{{'ebokApp.notification.description' | translate}}">
                        <div [innerHTML]="notification?.description"></div>
                    </p-fieldset>
                </p-card>
            </div>

            <div class="col-md-4">
                <p-card>
                    <p-fieldset legend="{{'ebokApp.notification.category' | translate}}">
                        <p class="table-badge category-{{notification?.category}}">
                            {{notification?.category}}</p>
                    </p-fieldset>

                    <p-fieldset legend="{{'ebokApp.notification.recepient' | translate}}">
                        <p-table [value]="recipients" [paginator]="true" [rows]="5">
                            <ng-template pTemplate="header">
                                <tr>
                                    <th>Imię</th>
                                    <th>Nazwisko</th>
                                </tr>
                            </ng-template>
                            <ng-template pTemplate="body" let-recipient>
                                <tr>
                                    <td>{{recipient.firstName}}</td>
                                    <td>{{recipient.lastName}}</td>
                                </tr>
                            </ng-template>
                        </p-table>
                    </p-fieldset>
                </p-card>
            </div>
        </div>
        <div class="row p-mt-4">
            <div class="col-md-12">
                <button type="button" id="cancel-save" class="btn btn-danger" (click)="previousState()">
                    <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
                </button>
            </div>
        </div>
    </div>
</div>
