<div class="row justify-content-center">
    <div class="col-8">
        <div *ngIf="notificationRead">
            <h2><span jhiTranslate="ebokApp.notificationRead.detail.title">Notification Read</span> {{ notificationRead.id }}</h2>

            <hr>

            <jhi-alert-error></jhi-alert-error>

            <dl class="row-md jh-entity-details">
                <dt><span jhiTranslate="ebokApp.notificationRead.date">Date</span></dt>
                <dd>
                    <span>{{ notificationRead.date }}</span>
                </dd>
                <dt><span jhiTranslate="ebokApp.notificationRead.notify">Notify</span></dt>
                <dd>
                    <span>{{ notificationRead.notify }}</span>
                </dd>
                <dt><span jhiTranslate="ebokApp.notificationRead.user">User</span></dt>
                <dd>
                    <span *ngFor="let user of notificationRead.users; let last = last">
                        {{ user.login }}{{ last ? '' : ', ' }}
                    </span>
                </dd>
            </dl>

            <button type="submit"
                    (click)="previousState()"
                    class="btn btn-info">
                <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
            </button>

            <button type="button"
                    [routerLink]="['/notification-read', notificationRead.id, 'edit']"
                    class="btn btn-primary">
                <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
            </button>
        </div>
    </div>
</div>
