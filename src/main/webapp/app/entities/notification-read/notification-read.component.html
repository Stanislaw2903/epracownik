<div>
    <h2 id="page-heading">
        <span jhiTranslate="ebokApp.notificationRead.home.title">Notification Reads</span>

        <button id="jh-create-entity" class="btn btn-primary float-right jh-create-entity create-notification-read" [routerLink]="['/notification-read/new']">
            <fa-icon icon="plus"></fa-icon>
            <span  jhiTranslate="ebokApp.notificationRead.home.createLabel">
            Create a new Notification Read
            </span>
        </button>
    </h2>

    <jhi-alert-error></jhi-alert-error>

    <jhi-alert></jhi-alert>

    <div class="alert alert-warning" id="no-result" *ngIf="notificationReads?.length === 0">
        <span jhiTranslate="ebokApp.notificationRead.home.notFound">No notificationReads found</span>
    </div>

    <div class="table-responsive" id="entities" *ngIf="notificationReads && notificationReads.length > 0">
        <table class="table table-striped" aria-describedby="page-heading">
            <thead>
                <tr>
                    <th scope="col" ><span jhiTranslate="global.field.id">ID</span></th>
                    <th scope="col" ><span jhiTranslate="ebokApp.notificationRead.date">Date</span></th>
                    <th scope="col" ><span jhiTranslate="ebokApp.notificationRead.notify">Notify</span></th>
                    <th scope="col" ><span jhiTranslate="ebokApp.notificationRead.user">User</span></th>
                    <th scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let notificationRead of notificationReads ;trackBy: trackId">
                    <td><a [routerLink]="['/notification-read', notificationRead.id, 'view']">{{ notificationRead.id }}</a></td>
                    <td>{{ notificationRead.date | date:'medium' }}</td>
                    <td>{{ notificationRead.notify }}</td>
                    <td>
                        <span *ngFor="let user of notificationRead.users; let last = last">
                            {{ user.login }}{{ last ? '' : ', ' }}
                        </span>
                    </td>
                    <td class="text-right">
                        <div class="btn-group">
                            <button type="submit"
                                    [routerLink]="['/notification-read', notificationRead.id, 'view']"
                                    class="btn btn-info btn-sm">
                                <fa-icon icon="eye"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                            </button>

                            <button type="submit"
                                    [routerLink]="['/notification-read', notificationRead.id, 'edit']"
                                    class="btn btn-primary btn-sm">
                                <fa-icon icon="pencil-alt"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Edit</span>
                            </button>

                            <button type="submit" (click)="delete(notificationRead)"
                                    class="btn btn-danger btn-sm">
                                <fa-icon icon="times"></fa-icon>
                                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
