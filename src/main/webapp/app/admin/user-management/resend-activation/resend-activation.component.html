<div class="modal-header">
    <h4 class="modal-title">Wysyłka ponowna maili aktywacyjnych</h4>
    <button type="button" class="close" data-dismiss="modal" aria-hidden="true" (click)="cancel()">&times;</button>
</div>

<div class="modal-body">
<div class="alert alert-success" role="alert" *ngIf="countOfSendedUsers !== null && countOfSendedUsers !== undefined">
    Wysłano maili do: {{ countOfSendedUsers }} użytkowników
</div>
<p-table *ngIf="integrationStatus?.error" [value]="integrationStatus.error">
    <ng-template pTemplate="header">
        <tr>
            <th >Imię</th>
            <th pSortableColumn="user.lastName">Nazwisko <p-sortIcon field="name"></p-sortIcon></th>
            <th pSortableColumn="user.email">Email <p-sortIcon field="category"></p-sortIcon></th>
            <th pSortableColumn="error">Typ błędu <p-sortIcon field="quantity"></p-sortIcon></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-status>
        <tr>
            <td>{{status.user.firstName}}</td>
            <td>{{status.user.lastName}}</td>
            <td>{{status.user.email}}</td>
            <td>{{'userManagement.integrationError.'+status.error | translate}}</td>
        </tr>
    </ng-template>
</p-table>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
        <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.close">Close</span>
    </button>
</div>
