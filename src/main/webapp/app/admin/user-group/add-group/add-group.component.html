<div class="container mt-4">
  <h2 id="myUserLabel" jhiTranslate="userGroups.home.addGroup">Create or edit a User</h2>
  <form (ngSubmit)="saveGroup()" class="mt-4">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label for="groupCode">{{ 'userGroups.addEdit.code' | translate }}</label>
          <input type="text" id="groupCode" class="form-control" [(ngModel)]="group.code" name="code" required />
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label for="groupName">{{ 'userGroups.addEdit.name' | translate }}</label>
          <input type="text" id="groupName" class="form-control" [(ngModel)]="group.name" name="name" required />
        </div>
      </div>
    </div>
    <div class="row mt-3">
      <div class="col-md-12">
        <button type="button" class="btn btn-secondary mr-2" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>
        <button type="submit" class="btn btn-primary">
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </div>
  </form>
</div>
